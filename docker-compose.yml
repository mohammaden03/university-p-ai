version: "3.8"

services:
  htr-ai-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: persian-arabic-htr-service:latest
    container_name: htr_ai_service
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - APP_ENV=production
      - LOG_LEVEL=INFO
      - HOST=0.0.0.0
      - PORT=8000
      - MODEL_ENGINE=torch_crnn
      - DEFAULT_MODEL_ID=persian-arabic-crnn-v1
      - INFERENCE_DEVICE=cpu
      - MAX_UPLOAD_SIZE=26214400
      - ALLOWED_ORIGINS=*
    volumes:
      # Persistent model weights, training checkpoints, and manuscript datasets
      - ./storage/models:/app/storage/models
      - ./storage/checkpoints:/app/storage/checkpoints
      - ./storage/datasets:/app/storage/datasets
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
